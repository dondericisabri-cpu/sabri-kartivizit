<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Kod Oluştur</title><style>body{margin:0;background:#eef1ed;color:#173f35;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.box{width:min(92%,520px);background:#fff;padding:32px;border-radius:24px;box-shadow:0 20px 60px #173f3520}h1{font-family:Georgia,serif;margin-top:0}label{font-weight:700}input{box-sizing:border-box;width:100%;margin:8px 0 12px;padding:14px;border:1px solid #cdd5d1;border-radius:10px;font:inherit}button,a{display:inline-block;border:0;border-radius:10px;background:#173f35;color:#fff;padding:13px 17px;font-weight:700;text-decoration:none;cursor:pointer}#result{margin-top:25px;text-align:center}img{width:280px;max-width:100%;height:auto;border:10px solid #fff}small{display:block;color:#68766f;margin-top:12px}</style></head><body><main class="box"><h1>Site QR Kodunu Oluştur</h1><p>GitHub Pages’te yayınladıktan sonra sitenizin tam adresini aşağıya yapıştırın.</p><label for="url">Yayın adresi</label><input id="url" type="url" placeholder="https://kullaniciadi.github.io/sabri-kartvizit/" autocomplete="url"><button id="make">QR kodu hazırla</button><div id="result" hidden><img id="qr" alt="Site QR kodu"><p><a id="download" target="_blank" rel="noopener">QR kodunu aç / kaydet</a></p><small>Bu QR yalnızca girdiğiniz yayın adresine yönlendirir. Aynı adresi koruduğunuz sürece QR kalıcıdır.</small></div></main><script>const u=document.getElementById('url'),r=document.getElementById('result'),q=document.getElementById('qr'),d=document.getElementById('download');document.getElementById('make').onclick=()=>{try{const v=new URL(u.value.trim());if(!/^https?:$/.test(v.protocol))throw 0;const src='https://api.qrserver.com/v1/create-qr-code/?size=900x900&margin=30&data='+encodeURIComponent(v.href);q.src=src;d.href=src;r.hidden=false}catch(e){alert('Lütfen https:// ile başlayan geçerli bir yayın adresi girin.')}};</script></body></html>
